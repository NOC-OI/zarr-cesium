name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const expectedTag = `v${packageJson.version}`;
          const versions = {
            tag: process.env.RELEASE_TAG,
            packageJson: packageJson.version,
            packageLock: packageLock.version,
            packageLockRoot: packageLock.packages?.['']?.version
          };

          if (
            versions.tag !== expectedTag ||
            versions.packageLock !== packageJson.version ||
            versions.packageLockRoot !== packageJson.version
          ) {
            console.error('Release versions do not match:', versions);
            console.error(`Expected tag: ${expectedTag}`);
            process.exit(1);
          }

          console.log('Release versions match:', versions);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
